llmproxy:
  host: 0.0.0.0
  port: 8000
  logs_dir: ./logs
  trace_dir: ./traces
  web_search:
    enabled: true
    base_url: http://wingman.akhbar.lan:7000
    format: markdown
    extract: 5
    extract_mode: auto
    limit: 25
    filter: false
    mode: balanced  # any | fast | balanced
    engines: []  # bing, google, yandex, baidu, duckduckgo, ecosia (empty = all)
  web_fetch:
    format: markdown  # json | markdown | text | ndjson
    mode: auto  # auto | fast | rendered
    min_runes: 0  # minimum character count for extracted content
  endpoints:
    default:
      base_url: http://wingman.akhbar.lan:8000/v1
      models:
      - '*'
      log: false
      enabled: true
      api_key: sk-123
      max_models: 1
    openai:
      base_url: http://wingman.akhbar.lan:8000/v1
      models:
      - gpt-5.1
      log: true
      enabled: true
      api_key: sk-123
      max_models: 1
