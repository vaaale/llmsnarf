llmproxy:
  host: 0.0.0.0
  port: 8000
  logs_dir: ./logs
  trace_dir: ./traces
  web_search:
    enabled: true
    base_url: http://wingman.akhbar.lan:7000
    format: markdown
    extract: 3
    extract_mode: auto
    limit: 25
    filter: false
  endpoints:
    default:
      base_url: http://wingman.akhbar.lan:8000/v1
      models:
      - '*'
      log: true
      enabled: true
      api_key: sk-123
    openai:
      base_url: http://wingman.akhbar.lan:8000/v1
      models:
      - gpt-5.1
      log: true
      enabled: true
      api_key: sk-123
