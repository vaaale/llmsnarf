[project]
name = "openaiproxy"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10,<3.13"
dependencies = [
  "httpx>=0.28.1",
  "pydantic-settings>=2.12.0",
  "fastapi>=0.115.0",
  "pyyaml>=6.0.0",
  "uvicorn>=0.32.0",
  "sentence-transformers>=5.7.0",
  "freetoken[accel]>=0.1.2",
  "orjson>=3.12.0",
]

[project.optional-dependencies]
local-embeddings = [
  "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[project.scripts]
llmproxy = "openaiproxy.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
