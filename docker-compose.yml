services:
  llm-snarf:
    build: .
    container_name: llmsnarf
    hostname: llmsnarf
#    image: alexakhbar/llmsnarf:latest
    env_file:
      - .env
    ports:
      - "${PORT}:8080"
    networks:
      - llmsnarf
    volumes:
      - ./llmproxy.yaml:/app/llmproxy.yaml
      - ./traces:/app/traces
      - ./logs:/app/logs
    depends_on:
      - openserp

  openserp:
    image: karust/openserp:latest
    command: serve -l
    ports:
      - "7001:7000"
    networks:
      - llmsnarf
    environment:
      - PORT=7000

networks:
  llmsnarf:
    driver: bridge
